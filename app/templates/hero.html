<!DOCTYPE html>
<html lang="{{ current_lang or 'en' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ seo_title }}</title>
    {% include "includes/seo_head.html" %}
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/hero.css') }}?v={{ asset_v.hero_css }}" />
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #070706;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="preloader" class="preloader" role="status" aria-live="polite" aria-label="Nexaries">
      <div class="preloader__inner">
        <div class="preloader__emblem" aria-hidden="true">
          <span class="preloader__ring"></span>
          <span class="preloader__mark">&lt;/&gt;</span>
        </div>
        <p class="preloader__name">Nexaries</p>
        <div class="preloader__track" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <div class="hero-atmosphere" aria-hidden="true">
      <div class="hero-atmosphere__smoke hero-atmosphere__smoke--warm"></div>
      <div class="hero-atmosphere__smoke hero-atmosphere__smoke--cool"></div>
      <div class="hero-atmosphere__smoke hero-atmosphere__smoke--lift"></div>
      <div class="hero-atmosphere__vignette"></div>
    </div>
    <canvas id="bg"></canvas>

    <section class="hero">
      <h1 class="hero-mark">Nexaries</h1>

      <p class="subtitle">
        <span id="typing" data-text="{{ _('hero.typing') }}"></span>
      </p>

      <a href="{{ url_for('index', lang=current_lang) }}" class="btn">View overview</a>
    </section>

    <div class="hero-veil" aria-hidden="true">
      <div class="hero-veil__beam"></div>
      <div class="hero-veil__shade"></div>
    </div>

    <script
      type="module"
      src="{{ url_for('static', filename='js/hero.js') }}?v={{ asset_v.hero_js }}"
    ></script>
  </body>
</html>
