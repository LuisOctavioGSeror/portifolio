{# Shared SEO tags — expects seo_title, seo_description, seo_keywords, seo_site_name #}
<meta name="description" content="{{ seo_description }}" />
<meta name="keywords" content="{{ seo_keywords }}" />
<meta name="author" content="Nexaries" />
<link rel="canonical" href="{{ canonical_url }}" />
{% for hreflang, href in hreflang_links %}
<link rel="alternate" hreflang="{{ hreflang }}" href="{{ href }}" />
{% endfor %}
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{ seo_site_name }}" />
<meta property="og:title" content="{{ seo_title }}" />
<meta property="og:description" content="{{ seo_description }}" />
<meta property="og:url" content="{{ canonical_url }}" />
<meta property="og:image" content="{{ url_for('static', filename='img/code.jpg', _external=True) }}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:locale" content="{{ og_locale }}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="{{ url_for('static', filename='img/code.jpg', _external=True) }}" />
<meta name="twitter:title" content="{{ seo_title }}" />
<meta name="twitter:description" content="{{ seo_description }}" />
